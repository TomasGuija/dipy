name: syn_mi_default
description: Initial SyN-only Mattes mutual information benchmark configuration.

registration:
  metric: MI
  level_iters: [20, 20, 10]
  grad_step: 0.25
  mi_nbins: 32
  initial_transform: Identity
  convergence_tol: 1.0e-7
  convergence_window: 8

dipy:
  metric_class: MIMetric
  update_field_sigma: 2.0
  ss_sigma_factor: 0.5
  inv_iter: 20
  inv_tol: 1.0e-3

ants:
  syn_metric: mattes
  flow_sigma: 2.0
  total_sigma: 0.0